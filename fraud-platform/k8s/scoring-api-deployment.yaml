apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-api
  namespace: fraud-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scoring-api
  template:
    metadata:
      labels:
        app: scoring-api
    spec:
      containers:
      - name: scoring-api
        image: fraud-platform/scoring-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_BROKER
          value: "kafka:9092"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: scoring-api
  namespace: fraud-platform
spec:
  selector:
    app: scoring-api
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer
